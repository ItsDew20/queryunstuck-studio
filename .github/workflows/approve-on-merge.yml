# When Dew merges a content PR, mark the piece as approved on main.
name: approve-on-merge
on:
  pull_request:
    types: [closed]
    branches: [main]
# Pushes go through the queryunstuck-bot GitHub App, the ruleset bypass actor for main.
permissions:
  contents: read
jobs:
  approve:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'content/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.QU_APP_CLIENT_ID }}
          private-key: ${{ secrets.QU_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - name: Set status approved
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, glob, datetime
          pid = os.environ["BRANCH"].split("/", 1)[1]
          matches = glob.glob(f"content/{pid}-*/spec.json") or glob.glob(f"content/{pid}/spec.json")
          assert matches, f"no spec for {pid}"
          p = matches[0]
          s = json.load(open(p))
          s["status"] = "approved"
          s["history"].append({"at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
                               "agent": "github-actions", "action": "approved",
                               "note": f"PR #{os.environ['PR']} merged"})
          json.dump(s, open(p, "w"), indent=2, ensure_ascii=False); open(p, "a").write("\n")
          print("approved", p)
          PY
      - name: Commit and push as the bot
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          uid=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${uid}+${APP_SLUG}[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -am "approve: ${BRANCH}"
          git push
